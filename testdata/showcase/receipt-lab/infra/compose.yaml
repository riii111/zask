services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: receipt_lab
      POSTGRES_USER: receipt_lab
      POSTGRES_PASSWORD: receipt_lab
    ports:
      - "15432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"

  object-store:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: receipt_lab
      MINIO_ROOT_PASSWORD: receipt_lab_demo
    ports:
      - "19000:9000"
      - "19001:9001"
