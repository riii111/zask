x-log-service: &log-service
  image: postgres:16-alpine
  entrypoint: ["/bin/sh", "-c"]
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: receipt_lab
      POSTGRES_USER: receipt_lab
      POSTGRES_PASSWORD: receipt_lab
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U receipt_lab -d receipt_lab"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  object-store:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: receipt_lab
      MINIO_ROOT_PASSWORD: receipt_lab_demo
    ports:
      - "19000:9000"
      - "19001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  ingest-gateway:
    <<: *log-service
    command:
      - |
        i=1
        echo '{"service":"ingest-gateway","level":"info","event":"boot","role":"receipt-upload-edge","queue":"receipts.raw"}'
        while true; do
          if [ $$((i % 7)) -eq 0 ]; then
            echo "{\"ts\":\"$$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"service\":\"ingest-gateway\",\"level\":\"warn\",\"event\":\"rate.limit.soft\",\"queue\":\"receipts.raw\",\"backlog\":$$((20 + i % 40)),\"retry_in_ms\":$$((150 + i * 3))}"
          else
            echo "{\"ts\":\"$$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"service\":\"ingest-gateway\",\"level\":\"info\",\"event\":\"receipt.accepted\",\"queue\":\"receipts.raw\",\"batch\":$$((3 + i % 16)),\"latency_ms\":$$((24 + i % 90)),\"trace_id\":\"demo-ingest-$$i\"}"
          fi
          i=$$((i + 1))
          sleep 1
        done
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      object-store:
        condition: service_started

  ledger-reconciler:
    <<: *log-service
    command:
      - |
        i=1
        echo '{"service":"ledger-reconciler","level":"info","event":"boot","role":"payment-matching","queue":"ledger.pending"}'
        while true; do
          if [ $$((i % 5)) -eq 0 ]; then
            echo "{\"ts\":\"$$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"service\":\"ledger-reconciler\",\"level\":\"warn\",\"event\":\"payment.match.deferred\",\"queue\":\"ledger.pending\",\"unmatched\":$$((2 + i % 7)),\"reason\":\"statement-window-open\"}"
          else
            echo "{\"ts\":\"$$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"service\":\"ledger-reconciler\",\"level\":\"info\",\"event\":\"payment.match.checked\",\"queue\":\"ledger.pending\",\"batch\":$$((1 + i % 8)),\"latency_ms\":$$((40 + i % 120)),\"trace_id\":\"demo-ledger-$$i\"}"
          fi
          i=$$((i + 1))
          sleep 2
        done
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  receipt-indexer:
    <<: *log-service
    command:
      - |
        i=1
        echo '{"service":"receipt-indexer","level":"info","event":"boot","role":"search-projection","queue":"receipts.enriched"}'
        while true; do
          if [ $$((i % 6)) -eq 0 ]; then
            echo "{\"ts\":\"$$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"service\":\"receipt-indexer\",\"level\":\"warn\",\"event\":\"index.refresh.lagging\",\"queue\":\"receipts.enriched\",\"lag_ms\":$$((300 + i * 9)),\"shard\":\"receipts-$$(printf %02d $$((i % 4)))\"}"
          else
            echo "{\"ts\":\"$$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"service\":\"receipt-indexer\",\"level\":\"info\",\"event\":\"index.updated\",\"queue\":\"receipts.enriched\",\"batch\":$$((4 + i % 18)),\"latency_ms\":$$((30 + i % 140)),\"trace_id\":\"demo-index-$$i\"}"
          fi
          i=$$((i + 1))
          sleep 2
        done
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  notification-relay:
    <<: *log-service
    command:
      - |
        i=1
        echo '{"service":"notification-relay","level":"info","event":"boot","role":"customer-notifications","queue":"notifications.ready"}'
        while true; do
          if [ $$((i % 4)) -eq 0 ]; then
            echo "{\"ts\":\"$$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"service\":\"notification-relay\",\"level\":\"warn\",\"event\":\"provider.backoff\",\"queue\":\"notifications.ready\",\"provider\":\"demo-mail\",\"retry_in_ms\":$$((500 + i * 11))}"
          else
            echo "{\"ts\":\"$$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"service\":\"notification-relay\",\"level\":\"info\",\"event\":\"notification.dispatched\",\"queue\":\"notifications.ready\",\"batch\":$$((1 + i % 5)),\"latency_ms\":$$((60 + i % 200)),\"trace_id\":\"demo-notify-$$i\"}"
          fi
          i=$$((i + 1))
          sleep 3
        done
    depends_on:
      redis:
        condition: service_healthy
